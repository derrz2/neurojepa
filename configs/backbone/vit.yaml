model:
  backbone_name: "vit"
  backbone_family: "vit"
  model_size: "small"
  img_size: [100, 200]
  patch_size: [1, 40]
  reg_tokens: 1
  mlp_ratio: 4.0
  ffn_layer: "mlp"
  init_values: 1.0e-5
  qkv_bias: true
  qk_norm: true
  norm:
    type: "layernorm"
    eps: 1.0e-6
    qk_type: "layernorm"
  drop_rate: 0.0
  attn_drop_rate: 0.0
  drop_path_rate: 0.1
  downstream: false
  global_pool: "token"
  gate_attention: "elementwise"
  pos_embed: "learn"
  rope:
    enable: true
    rotary_dim_ratio: 0.5
    base: 300.0
    normalize_coords: "separate"
    layer_start: 1
    layer_end: 12
